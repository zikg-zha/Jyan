# 推送到 main 后自动构建并发布 public/ 到 GitHub Pages
# 首次使用：仓库 Settings → Pages → Build and deployment → Source 选 “GitHub Actions”
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 前端构建不需要旧版后端的原生模块（better-sqlite3），跳过安装脚本
      - run: npm ci --ignore-scripts
      # build 先把 vendor 同步好，lint 才能校验引用的资源都存在
      - run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
